[package]
name = "topcoat-css-build"
description = "Build-script compiler and stylesheet collection for topcoat-css"
documentation = "https://docs.rs/topcoat-css-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE.md"]

[dependencies]
proc-macro2.workspace = true
syn.workspace = true
serde_json.workspace = true
topcoat-css-core = { workspace = true, features = ["compiler"] }

[dev-dependencies]
tempfile = "3.27.0"
