[package]
name = "topcoat-css-core"
description = "Shared build manifest for topcoat-css (implementation detail)"
documentation = "https://docs.rs/topcoat-css-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml", "README.md", "LICENSE.md"]

[dependencies]
proc-macro2.workspace = true
serde.workspace = true
syn = { workspace = true, optional = true }
sha2 = { version = "0.11.0", optional = true }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["visitor"], optional = true }

[features]
compiler = ["dep:syn", "dep:sha2", "dep:lightningcss"]
